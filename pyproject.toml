[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-lab-dashboard"
version = "1.0.0"
description = "Auditable multi-asset portfolio performance and risk research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
live = ["yfinance>=0.2.54,<2"]

[project.scripts]
portfolio-lab = "portfolio_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["portfolio_lab*"]
